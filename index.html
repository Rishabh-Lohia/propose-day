<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #0f0f14;
      color: #fff;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    section {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .soft-bg {
      background: linear-gradient(180deg, #1c1c28, #0f0f14);
    }

    h1 {
      font-size: 32px;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .hint {
      position: absolute;
      bottom: 30px;
      font-size: 14px;
      opacity: 0.6;
    }

    /* Proposal section */
    .proposal {
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 200px;
    }

    .yes-btn {
      background: #ff4d6d;
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .no-btn {
      position: absolute;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>

  <!-- SECTION 1 -->
  <section class="soft-bg">
    <div>
      <h1>It all started<br>with a simple hello…</h1>
      <div class="hint">↓ swipe</div>
    </div>
  </section>

  <!-- SECTION 2 -->
  <section>
    <div>
      <h1>Somewhere along the way,</h1>
      <p>you became my calm,<br>my favorite place to be.</p>
    </div>
  </section>

  <!-- SECTION 3 -->
  <section class="soft-bg">
    <div>
      <h1>Every version of my future</h1>
      <p>has one thing in common.<br><br><strong>You.</strong> ❤️</p>
    </div>
  </section>

  <!-- SECTION 4 -->
  <section>
    <div>
      <h1>And that brings me</h1>
      <p>to the easiest question<br>I’ve ever had to ask…</p>
    </div>
  </section>

  <!-- SECTION 5: PROPOSAL -->
  <section class="soft-bg proposal">
    <h1>Will you be my forever valentine? </h1>

    <div class="buttons" id="buttonArea">
      <button class="yes-btn" onclick="sayYes()" id="yesBtn">YES ❤️</button>
      <button class="no-btn" id="noBtn">no</button>
    </div>
  </section>

  <canvas class="confetti" id="confetti"></canvas>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn")
    const area = document.getElementById("buttonArea");
    let attempts = 0;

   
function moveNoButton() {
  
  const containerWidth = area.clientWidth;
  const containerHeight = area.clientHeight;
  
  // Get button dimensions (offsetWidth includes borders/padding)
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

// 1. Get Yes button position relative to the container
  // We use getBoundingClientRect to get absolute viewport coords, then subtract 
  // the container's coords to get the relative offset (left/top) inside the area.
  const areaRect = area.getBoundingClientRect();
  const yesRect = yesBtn.getBoundingClientRect();
  
  const yesLeft = yesRect.left - areaRect.left;
  const yesTop = yesRect.top - areaRect.top;
  const yesRight = yesLeft + yesRect.width;
  const yesBottom = yesTop + yesRect.height;

  // 2. Calculate the maximum movable area
  const maxX = containerWidth - btnWidth;
  const maxY = containerHeight - btnHeight;

  let newX, newY;
  let isOverlapping = false;
  let safetyCounter = 0;

  // 2. Loop to find a safe spot
  do {
    newX = Math.random() * maxX;
    newY = Math.random() * maxY;

    // Define the rectangle for the proposed new spot
    const noLeft = newX;
    const noRight = newX + btnWidth;
    const noTop = newY;
    const noBottom = newY + btnHeight;

    // 3. Collision Detection (Axis-Aligned Bounding Box)
    // Checks if the two rectangles intersect
    isOverlapping = (
      noLeft < yesRight &&
      noRight > yesLeft &&
      noTop < yesBottom &&
      noBottom > yesTop
    );

    safetyCounter++;
    // Break after 50 tries to prevent infinite loops if the screen is too small
  } while (isOverlapping && safetyCounter < 50);

  // 4. Apply the position
  // IMPORTANT: We switch from 'transform' to 'left/top' for absolute coordinates
  noBtn.style.position = "absolute"; 
  noBtn.style.left = `${newX}px`;
  noBtn.style.top = `${newY
}px`;
  
  // Clear transform to prevent conflicts if CSS had it
  noBtn.style.transform = "none";

  attempts++;

  if (attempts === 3) noBtn.textContent = "nice try 😄";
  if (attempts === 5) noBtn.textContent = "not happening";
  if (attempts === 7) noBtn.style.opacity = "0";
}

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    function sayYes() {
      startConfetti();
      document.querySelector(".proposal h1").textContent =
        "You just made me the happiest person alive ❤️";
      area.style.display = "none";
    }

    /* Simple confetti */
    function startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = Array.from({ length: 150 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 6 + 2,
        d: Math.random() * 10 + 5,
        color: `hsl(${Math.random() * 360},100%,70%)`
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
          p.y += p.d;
          if (p.y > canvas.height) p.y = -10;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>

</body>
</html>
