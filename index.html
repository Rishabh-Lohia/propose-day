<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Forever</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --soft-pink: #ffeef0;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffeef0 0%, #ffdde1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevents scrolling when button moves */
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            width: 100%;
            height: 200px;
        }
        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            z-index: 100;
        }
        #noBtn {
            background-color: #ffffff;
            color: #999;
            position: absolute;
        }
        .celebration {
            display: none;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div id="image-placeholder">❤️</div>
        <h1>Will you be mine forever?</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="showLove()">YES</button>
            <button id="noBtn" ontouchstart="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div class="container celebration" id="success-msg">
        <h1>💍 I love you! ❤️</h1>
        <p>Best decision ever.</p>
    </div>

    <script>
        let yesSize = 1.2;
        let noSize = 1.2;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // 1. Move the No button
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // 2. Make Yes bigger and No smaller
            yesSize += 0.2;
            noSize -= 0.1;
            yesBtn.style.transform = `scale(${yesSize})`;
            noBtn.style.transform = `scale(${noSize})`;

            // 3. Change text if she keeps trying
            if(noSize < 0.6) {
                noBtn.innerHTML = "Wait, what?";
            }
        }

        function showLove() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            // Simple visual "pop"
            document.body.style.background = "#ff4d6d";
            document.getElementById('success-msg').style.color = "white";
            document.querySelector('#success-msg h1').style.color = "white";
        }
    </script>
</body>
</html>
