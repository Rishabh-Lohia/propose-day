<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ffeef0;
            text-align: center;
        }
        h1 { color: #d63384; }
        .buttons { margin-top: 20px; position: relative; width: 300px; height: 100px; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: 0.3s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; margin-right: 10px; }
        #noBtn { background-color: #adb5bd; color: white; position: absolute; }
        .hidden { display: none; }
        #success-msg { font-size: 24px; color: #d63384; font-weight: bold; }
    </style>
</head>
<body>

    <div id="quiz">
        <h1 id="question">Will you make me the happiest person in the world? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div id="success-msg" class="hidden">
        <h1>I knew you'd say yes! 💍✨</h1>
        <p>I love you forever.</p>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Move the "No" button to a random position within the viewport
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
            // Optional: You could trigger confetti here!
        }
    </script>
</body>
</html>
